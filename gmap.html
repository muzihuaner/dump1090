<!DOCTYPE html>
<html lang="zh-CN" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no, width=device-width">
    <title>Dump1090 - 航空雷达</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <script>
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        body { margin: 0; padding: 0; height: 100dvh; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        #canvas { height: 100%; width: 100%; z-index: 1; }
        .plane-icon { transition: transform 500ms linear; display: flex; align-items: center; justify-content: center; }
        .dark .leaflet-tile { filter: brightness(0.6) invert(1) contrast(3) hue-rotate(200deg) saturate(0.3) brightness(0.7); }
        .leaflet-control-zoom { border: none !important; margin-left: 16px !important; margin-bottom: 24px !important; }
    </style>
</head>

<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <div id="canvas"></div>

    <div class="fixed top-4 left-4 z-[1001] flex flex-col gap-3">
        <button id="theme-toggle" class="p-3 rounded-xl bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border border-slate-200 dark:border-slate-700 shadow-lg hover:scale-105 active:scale-95 transition-all">
            <i id="theme-icon" class="fa-solid fa-moon text-slate-600 dark:text-yellow-400"></i>
        </button>
        <button id="locate-me" class="p-3 rounded-xl bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border border-slate-200 dark:border-slate-700 shadow-lg hover:scale-105 active:scale-95 transition-all text-blue-500">
            <i class="fa-solid fa-crosshairs"></i>
        </button>
    </div>

    <div id="info-panel" class="fixed top-4 right-4 z-[1000] w-[320px] bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl border border-slate-200 dark:border-slate-700/50 rounded-2xl shadow-2xl overflow-hidden touch-none select-none">
        
        <div class="info-panel__header px-5 py-4 border-b border-slate-200 dark:border-slate-800 cursor-move flex justify-between items-center bg-slate-100/50 dark:bg-slate-800/50">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-tower-observation opacity-50"></i>
                <h1 class="text-xs font-bold tracking-widest uppercase">ADS-B 实时数据</h1>
            </div>
            <div id="status-dot" class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div>
        </div>

        <div class="p-5 space-y-4">
            <div id="generalInfo" class="flex items-baseline gap-2">
                <span class="text-3xl font-black text-blue-600 dark:text-amber-400">0</span>
                <span class="text-xs font-bold opacity-50 uppercase tracking-tighter">架目标在线</span>
            </div>

            <div id="planeInfo" class="pt-4 border-t border-slate-200 dark:border-slate-800">
                <div class="py-12 text-center opacity-40 text-sm">
                    <i class="fa-solid fa-plane-departure block text-2xl mb-2"></i>
                    点击地图图标显示详细参数
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>

    <script type="module">
        let map, userMarker;
        const planes = {};
        let selectedHex = null;

        // 初始化地图
        const init = () => {
            const saved = JSON.parse(localStorage.getItem('mapView'));
            map = L.map('canvas', { zoomControl: true, attributionControl: false })
                   .setView(saved ? [saved.lat, saved.lng] : [31.23, 121.47], saved ? saved.zoom : 10);
            
            map.zoomControl.setPosition('bottomleft');
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            map.on('moveend', () => {
                const c = map.getCenter();
                localStorage.setItem('mapView', JSON.stringify({lat: c.lat, lng: c.lng, zoom: map.getZoom()}));
            });
        };

        // 获取参数显示 HTML
        const renderPlaneCard = (p) => {
            const flight = p.flight?.trim() || 'N/A';
            const hex = p.hex;
            const icaoType = p.icaotype || 'N/A';
            const registration = p.registration || '';
            
            // 构建多渠道查询链接
            const fr24Link = `https://www.flightradar24.com/${flight}`;
            const flightAwareLink = `https://flightaware.com/live/modes/${hex.toLowerCase()}/redirect`;
            const flightStatsLink = `https://www.flightstats.com/go/FlightStatus/flightStatusByFlight.do?flightNumber=${flight}`;
            const planeFinderLink = `https://planefinder.net/flight/${flight}`;
            const adsbExchangeLink = `https://globe.adsbexchange.com/?icao=${hex.toLowerCase()}`;
            
            return `
                <div class="space-y-4 animate-in fade-in duration-300">
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-[10px] font-bold opacity-50 uppercase tracking-wider">航班呼号 (Flight)</p>
                            <div class="text-2xl font-black flex items-center gap-2">
                                ${flight}
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="text-[10px] font-bold opacity-50 uppercase tracking-wider">十六进制 (HEX)</p>
                            <span onclick="copyHex('${hex}')" class="font-mono text-xs bg-slate-100 dark:bg-slate-800 px-2 py-1 rounded cursor-pointer hover:bg-blue-100 dark:hover:bg-slate-700 transition-colors">${hex}</span>
                        </div>
                    </div>
                    
                    ${registration ? `
                    <div class="flex items-center gap-2 text-xs">
                        <span class="opacity-50">注册号:</span>
                        <span class="font-bold">${registration}</span>
                        ${icaoType !== 'N/A' ? `<span class="opacity-40">|</span><span class="opacity-50">机型:</span><span class="font-bold">${icaoType}</span>` : ''}
                    </div>
                    ` : ''}
                    
                    <!-- 多渠道查询链接 -->
                    <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-200 dark:border-slate-700/30">
                        <a href="${fr24Link}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-bold bg-blue-500 hover:bg-blue-600 text-white rounded-md transition-colors">
                            <i class="fa-solid fa-plane"></i> FlightRadar24
                        </a>
                        <a href="${flightAwareLink}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-bold bg-orange-500 hover:bg-orange-600 text-white rounded-md transition-colors">
                            <i class="fa-solid fa-location-arrow"></i> FlightAware
                        </a>
                        <a href="${planeFinderLink}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-bold bg-green-500 hover:bg-green-600 text-white rounded-md transition-colors">
                            <i class="fa-solid fa-satellite-dish"></i> PlaneFinder
                        </a>
                        <a href="${flightStatsLink}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-bold bg-purple-500 hover:bg-purple-600 text-white rounded-md transition-colors">
                            <i class="fa-solid fa-chart-line"></i> FlightStats
                        </a>
                        <a href="${adsbExchangeLink}" target="_blank" class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-bold bg-indigo-500 hover:bg-indigo-600 text-white rounded-md transition-colors">
                            <i class="fa-solid fa-globe"></i> ADS-B Exchange
                        </a>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-50 dark:bg-slate-800/40 p-3 rounded-xl border border-slate-100 dark:border-slate-700/30">
                            <p class="text-[10px] font-bold opacity-40 uppercase mb-1">高度 (Alt)</p>
                            <p class="font-bold tracking-tight">${p.altitude?.toLocaleString()}<span class="text-[10px] ml-1 opacity-60 font-normal">FT</span></p>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-800/40 p-3 rounded-xl border border-slate-100 dark:border-slate-700/30">
                            <p class="text-[10px] font-bold opacity-40 uppercase mb-1">速度 (Spd)</p>
                            <p class="font-bold tracking-tight">${p.speed || 0}<span class="text-[10px] ml-1 opacity-60 font-normal">KTS</span></p>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-800/40 p-3 rounded-xl border border-slate-100 dark:border-slate-700/30">
                            <p class="text-[10px] font-bold opacity-40 uppercase mb-1">航向 (Track)</p>
                            <div class="flex items-center gap-2">
                                <i class="fa-solid fa-arrow-up text-[10px] transition-transform duration-500" style="transform: rotate(${p.track}deg)"></i>
                                <p class="font-bold tracking-tight">${p.track || 0}°</p>
                            </div>
                        </div>
                        <div class="bg-slate-50 dark:bg-slate-800/40 p-3 rounded-xl border border-slate-100 dark:border-slate-700/30">
                            <p class="text-[10px] font-bold opacity-40 uppercase mb-1">坐标 (Lat/Lon)</p>
                            <p class="text-[10px] font-mono font-bold leading-tight uppercase">${p.lat?.toFixed(4)}<br>${p.lon?.toFixed(4)}</p>
                        </div>
                    </div>
                </div>
            `;
        };

        const fetchData = async () => {
            try {
                const res = await fetch('/data.json');
                const data = await res.json();
                const activeNow = new Set();

                data.forEach(p => {
                    if (p.lat == null) return;
                    activeNow.add(p.hex);
                    
                    if (planes[p.hex]) {
                        planes[p.hex].marker.setLatLng([p.lat, p.lon]);
                        const icon = getIcon(p, p.hex === selectedHex);
                        planes[p.hex].marker.setIcon(icon);
                        Object.assign(planes[p.hex], p);
                    } else {
                        const marker = L.marker([p.lat, p.lon], { icon: getIcon(p) }).addTo(map);
                        marker.on('click', (e) => {
                            L.DomEvent.stopPropagation(e);
                            selectedHex = p.hex;
                            updateDetailPanel(p);
                        });
                        planes[p.hex] = {...p, marker};
                    }
                    if(selectedHex === p.hex) updateDetailPanel(p);
                });

                Object.keys(planes).forEach(h => {
                    if (!activeNow.has(h)) {
                        map.removeLayer(planes[h].marker);
                        if(selectedHex === h) {
                            selectedHex = null;
                            document.getElementById('planeInfo').innerHTML = `<div class="py-12 text-center opacity-40 text-sm italic">目标已脱离雷达网</div>`;
                        }
                        delete planes[h];
                    }
                });
                document.querySelector('#generalInfo span').innerText = activeNow.size;
            } catch (e) {}
        };

        const updateDetailPanel = (p) => {
            const container = document.getElementById('planeInfo');
            container.innerHTML = renderPlaneCard(p);
        };

        const getIcon = (p, isSel) => L.divIcon({
            className: 'custom-icon',
            html: `<div class="plane-icon" style="transform: rotate(${p.track}deg)">
                    <i class="fa-solid fa-plane-up ${isSel ? 'text-red-500 scale-125' : 'text-amber-400'} drop-shadow-md" style="font-size: 20px;"></i>
                   </div>`,
            iconSize: [30, 30], iconAnchor: [15, 15]
        });

        window.copyHex = (hex) => {
            navigator.clipboard.writeText(hex).then(() => alert('HEX 已复制: ' + hex));
        };

        // 定位与主题
        document.getElementById('locate-me').onclick = () => {
            map.locate({setView: true, maxZoom: 13});
            map.on('locationfound', (e) => {
                if (userMarker) map.removeLayer(userMarker);
                userMarker = L.circleMarker(e.latlng, {radius: 6, color: '#fff', fillColor: '#3b82f6', fillOpacity: 1, weight: 2}).addTo(map);
            });
        };

        document.getElementById('theme-toggle').onclick = () => {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.theme = isDark ? 'dark' : 'light';
            document.getElementById('theme-icon').className = isDark ? 'fa-solid fa-moon text-yellow-400' : 'fa-solid fa-sun text-orange-500';
        };

        if (localStorage.theme === 'light') {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-icon').className = 'fa-solid fa-sun text-orange-500';
        }

        interact('#info-panel').draggable({
            allowFrom: '.info-panel__header',
            listeners: { move(e) {
                const t = e.target;
                const x = (parseFloat(t.dataset.x) || 0) + e.dx;
                const y = (parseFloat(t.dataset.y) || 0) + e.dy;
                t.style.transform = `translate(${x}px, ${y}px)`;
                t.dataset.x = x; t.dataset.y = y;
            }}
        });

        init();
        setInterval(fetchData, 1000);
    </script>
</body>
</html>
