<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <title>Dump1090 | 实时飞机雷达</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    backdropBlur: { xl: '24px' },
                    colors: {
                        panelDark: 'rgba(26, 26, 28, 0.6)',
                        panelLight: 'rgba(255, 255, 255, 0.8)',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #ffffff;
            --border-color: rgba(255, 255, 255, 0.1);
        }
        .light-mode {
            --bg-color: #f5f5f7;
            --text-color: #1d1d1f;
            --border-color: rgba(0, 0, 0, 0.1);
        }
        body { background-color: var(--bg-color); color: var(--text-color); transition: background 0.3s ease; }
        .leaflet-container { background: var(--bg-color) !important; }
        .plane-marker { display: flex; justify-content: center; align-items: center; border: none !important; background: none !important; }
        
        /* 隐藏 Leaflet 默认标志 */
        .leaflet-control-attribution { display: none; }

        @media (max-width: 640px) {
            #info-panel { width: calc(100% - 2rem); right: 1rem; left: 1rem; top: auto; bottom: 1.5rem; }
        }
    </style>
</head>

<body class="h-[100dvh] overflow-hidden font-sans">
    <div id="canvas" class="w-full h-full"></div>

    <div id="info-panel" 
        class="fixed top-6 right-6 w-80 bg-[var(--panel-bg)] backdrop-blur-xl border border-[var(--border-color)] rounded-3xl shadow-2xl z-[1000] select-none transition-all duration-500"
        style="--panel-bg: rgba(26, 26, 28, 0.6);">
        
        <div class="info-panel__header p-5 border-b border-white/5 cursor-move flex justify-between items-center">
            <div class="flex flex-col">
                <span class="text-[10px] font-bold tracking-[0.2em] text-blue-500 uppercase">实时监控</span>
                <h1 class="text-lg font-semibold tracking-tight">DUMP1090</h1>
            </div>
            <div class="flex items-center gap-3">
                <button id="theme-toggle" class="w-8 h-8 rounded-full bg-white/5 flex items-center justify-center hover:bg-white/10 transition-all">
                    <i id="theme-icon" class="fa-solid fa-moon text-blue-400"></i>
                </button>
                <div class="px-3 py-1 bg-white/5 rounded-full border border-white/10">
                    <span id="aircraft-count" class="text-xs font-mono text-green-500">0</span>
                    <span class="text-[10px] opacity-40 ml-1">架</span>
                </div>
            </div>
        </div>

        <div id="info-content" class="p-5">
            <div id="placeholder" class="py-12 text-center">
                <div class="w-12 h-12 bg-white/5 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-white/5">
                    <i class="fa-solid fa-radar text-blue-500/50"></i>
                </div>
                <p class="text-sm opacity-40">请在地图上选择一架飞机</p>
            </div>
            
            <div id="plane-info" class="hidden space-y-6">
                <div>
                    <div class="flex items-end justify-between mb-1">
                        <a id="val-flight-link" href="#" target="_blank" 
                           class="text-4xl font-bold tracking-tighter hover:text-blue-500 transition-all flex items-center gap-2 group">
                           <span id="val-flight">---</span>
                           <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-0 group-hover:opacity-100 transition-opacity"></i>
                        </a>
                        <span id="val-hex" class="text-xs font-mono opacity-30 mb-1">------</span>
                    </div>
                    <p class="text-[10px] opacity-40 uppercase tracking-widest">点击航班号查看 Flightradar24 详情</p>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-black/5 dark:bg-white/5 p-3 rounded-2xl border border-white/5">
                        <p class="text-[10px] uppercase opacity-40 mb-1 font-semibold">高度 Altitude</p>
                        <p id="val-alt" class="text-lg font-medium font-mono">-- <span class="text-[10px] opacity-40">FT</span></p>
                    </div>
                    <div class="bg-black/5 dark:bg-white/5 p-3 rounded-2xl border border-white/5">
                        <p class="text-[10px] uppercase opacity-40 mb-1 font-semibold">速度 Speed</p>
                        <p id="val-speed" class="text-lg font-medium font-mono">-- <span class="text-[10px] opacity-40">KT</span></p>
                    </div>
                    <div class="bg-black/5 dark:bg-white/5 p-3 rounded-2xl border border-white/5">
                        <p class="text-[10px] uppercase opacity-40 mb-1 font-semibold">航向 Track</p>
                        <p id="val-track" class="text-lg font-medium font-mono">--°</p>
                    </div>
                    <div class="bg-black/5 dark:bg-white/5 p-3 rounded-2xl border border-white/5">
                        <p class="text-[10px] uppercase opacity-40 mb-1 font-semibold">垂直速率 VSI</p>
                        <p id="val-vsi" class="text-lg font-medium font-mono">-- <span class="text-[10px] opacity-40">FPM</span></p>
                    </div>
                </div>

                <div class="pt-4 border-t border-white/5 flex justify-between items-center text-[10px] font-mono opacity-30">
                    <span id="val-lat">0.0000</span>
                    <span>/</span>
                    <span id="val-lon">0.0000</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/interactjs@1.10.27/dist/interact.min.js"></script>
    
    <script type="module">
        let map = null;
        let baseLayer = null;
        let isDark = true;
        const planes = {};
        let selectedHex = null;

        // 地图配置
        const mapConfigs = {
            dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
            light: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png'
        };

        const initMap = () => {
            map = L.map('canvas', { zoomControl: false, attributionControl: false }).setView([31.23, 121.47], 7);
            baseLayer = L.tileLayer(mapConfigs.dark).addTo(map);
        };

        // 切换主题逻辑
        const toggleTheme = () => {
            isDark = !isDark;
            const body = document.body;
            const panel = document.getElementById('info-panel');
            const icon = document.getElementById('theme-icon');

            if (isDark) {
                body.classList.remove('light-mode');
                panel.style.setProperty('--panel-bg', 'rgba(26, 26, 28, 0.6)');
                icon.className = 'fa-solid fa-moon text-blue-400';
                baseLayer.setUrl(mapConfigs.dark);
            } else {
                body.classList.add('light-mode');
                panel.style.setProperty('--panel-bg', 'rgba(255, 255, 255, 0.8)');
                icon.className = 'fa-solid fa-sun text-orange-500';
                baseLayer.setUrl(mapConfigs.light);
            }
            
            // 重新渲染所有飞机图标以适应背景
            Object.keys(planes).forEach(hex => {
                const p = planes[hex];
                p.marker.setIcon(createIcon(p.track, hex === selectedHex));
            });
        };

        const updateUI = (plane) => {
            if (!plane) return;
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('plane-info').classList.remove('hidden');

            const flight = plane.flight?.trim() || '未知航班';
            document.getElementById('val-flight').innerText = flight;
            document.getElementById('val-hex').innerText = plane.hex.toUpperCase();
            document.getElementById('val-alt').innerText = plane.altitude || 0;
            document.getElementById('val-speed').innerText = plane.speed || 0;
            document.getElementById('val-track').innerText = (plane.track || 0) + '°';
            document.getElementById('val-vsi').innerText = plane.vert_rate || 0;
            document.getElementById('val-lat').innerText = plane.lat.toFixed(4);
            document.getElementById('val-lon').innerText = plane.lon.toFixed(4);

            const linkEl = document.getElementById('val-flight-link');
            if (plane.flight) {
                linkEl.href = `https://www.flightradar24.com/${flight}`;
                linkEl.style.pointerEvents = 'auto';
                linkEl.style.opacity = '1';
            } else {
                linkEl.href = '#';
                linkEl.style.pointerEvents = 'none';
                linkEl.style.opacity = '0.5';
            }
        };

        const createIcon = (track, isSelected) => {
            // 根据主题和选中状态调整飞机颜色
            let color = isDark ? '#fbbf24' : '#d97706'; // 未选中：黄色/深琥珀
            if (isSelected) color = '#3b82f6'; // 选中：蓝色
            
            const scale = isSelected ? 'scale(1.3)' : 'scale(1)';
            return L.divIcon({
                className: 'plane-marker',
                html: `<div style="transform: rotate(${track}deg) ${scale}; color: ${color}; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);">
                         <i class="fa-solid fa-plane text-2xl"></i>
                       </div>`,
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });
        };

        const fetchData = async () => {
            try {
                const response = await fetch('/data.json'); 
                const data = await response.json();
                document.getElementById('aircraft-count').innerText = data.length;

                data.forEach(p => {
                    if (!p.lat || !p.lon) return;
                    if (planes[p.hex]) {
                        planes[p.hex].marker.setLatLng([p.lat, p.lon]);
                        const oldTrack = planes[p.hex].track;
                        Object.assign(planes[p.hex], p);
                        if (Math.abs(oldTrack - p.track) > 1) {
                            planes[p.hex].marker.setIcon(createIcon(p.track, p.hex === selectedHex));
                        }
                        if (selectedHex === p.hex) updateUI(p);
                    } else {
                        const marker = L.marker([p.lat, p.lon], { 
                            icon: createIcon(p.track, false) 
                        }).addTo(map);
                        marker.on('click', () => {
                            const oldSelected = selectedHex;
                            selectedHex = p.hex;
                            if (oldSelected && planes[oldSelected]) {
                                planes[oldSelected].marker.setIcon(createIcon(planes[oldSelected].track, false));
                            }
                            marker.setIcon(createIcon(p.track, true));
                            updateUI(p);
                        });
                        planes[p.hex] = { ...p, marker };
                    }
                });
            } catch (e) { console.log("等待数据源..."); }
        };

        // 初始化
        initMap();
        setInterval(fetchData, 1000);
        document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

        // 面板拖拽
        interact('#info-panel').draggable({
            allowFrom: '.info-panel__header',
            listeners: {
                move(event) {
                    const target = event.target;
                    const x = (parseFloat(target.dataset.x) || 0) + event.dx;
                    const y = (parseFloat(target.dataset.y) || 0) + event.dy;
                    target.style.transform = `translate(${x}px, ${y}px)`;
                    target.dataset.x = x;
                    target.dataset.y = y;
                }
            }
        });
    </script>
</body>

</html>
